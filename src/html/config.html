<div id="ksqld-config" class="ksqld-config">
  <div class="ksqld-toolbar">
    <div class="ksqld-toolbar-top">
      <h2 class="ksqld-title">kSQL Dashboard 設定</h2>
      <div class="ksqld-toolbar-actions">
        <button id="ksqld-save" class="ksqld-btn ksqld-btn-primary" type="button">保存</button>
        <button id="ksqld-cancel" class="ksqld-btn" type="button">キャンセル</button>
        <label class="ksqld-deploy ksqld-toolbar-deploy" title="オフの場合は設定の保存のみ。反映には別途アプリの更新が必要です。">
          <input type="checkbox" id="ksqld-deploy" />
          運用環境に反映
        </label>
        <span id="ksqld-message" class="ksqld-message" role="status"></span>
      </div>
    </div>

    <div class="ksqld-toolbar-controls">
      <div class="ksqld-field">
        <label class="ksqld-label" for="ksqld-view">対象の一覧（ビュー）</label>
        <select id="ksqld-view" class="ksqld-select">
          <option value="__default__">すべての一覧（共通）</option>
        </select>
      </div>
      <label class="ksqld-deploy ksqld-enabled-label">
        <input type="checkbox" id="ksqld-enabled" />
        <span id="ksqld-enabled-text">この一覧でダッシュボードを表示する</span>
      </label>
      <div class="ksqld-field" id="ksqld-source-row" hidden>
        <label class="ksqld-label" for="ksqld-source">表示するダッシュボード</label>
        <select id="ksqld-source" class="ksqld-select">
          <option value="common">共通（すべての一覧）</option>
          <option value="individual">個別（この一覧専用）</option>
        </select>
      </div>
    </div>
  </div>

  <p class="ksqld-hint">一覧ごとにダッシュボードを設定できます。「すべての一覧（共通）」は、個別設定の無い一覧に共通で表示されます。カスタマイズ一覧も選べます。</p>
  <p id="ksqld-common-note" class="ksqld-hint" hidden>この一覧では共通ダッシュボードを表示します。内容は「すべての一覧（共通）」で編集してください。</p>

  <div id="ksqld-editor" class="ksqld-editor">
    <section class="ksqld-section">
      <label class="ksqld-label" for="ksqld-split">画面分割数</label>
      <select id="ksqld-split" class="ksqld-select">
        <option value="1">1 分割（単一）</option>
        <option value="2">2 分割（横2）</option>
        <option value="3">3 分割（上2・下1）</option>
        <option value="4">4 分割（2×2）</option>
      </select>
      <p class="ksqld-hint">分割数に応じて、下の「ペイン一覧」の数が変わります。</p>
    </section>

    <section class="ksqld-section">
      <h3 class="ksqld-subtitle">ペイン一覧</h3>
      <div id="ksqld-panes" class="ksqld-panes"><!-- config.js が生成 --></div>
    </section>
  </div>
</div>

<!-- ペイン設定のテンプレート -->
<template id="ksqld-pane-template">
  <div class="ksqld-pane-card">
    <div class="ksqld-pane-head">
      <span class="ksqld-pane-index"></span>
      <input type="text" class="ksqld-input ksqld-pane-title" placeholder="ペインのタイトル" />
    </div>
    <label class="ksqld-label">SQL</label>
    <textarea class="ksqld-textarea ksqld-pane-sql" rows="4"
      placeholder="SELECT 担当, COUNT(*) AS 件数 FROM APP100 GROUP BY 担当"></textarea>
    <div class="ksqld-pane-validate">
      <button type="button" class="ksqld-btn ksqld-btn-sub ksqld-validate">検証</button>
      <span class="ksqld-validate-result" role="status"></span>
    </div>
    <pre class="ksqld-validate-plan" hidden></pre>
    <div class="ksqld-pane-display">
      <label class="ksqld-label">表示方法</label>
      <select class="ksqld-select ksqld-pane-type">
        <option value="table">表</option>
        <option value="chart">グラフ（棒）</option>
      </select>
      <div class="ksqld-chart-cols" hidden>
        <label class="ksqld-label-inline">グラフの向き
          <select class="ksqld-select ksqld-pane-chart-type">
            <option value="bar">横棒</option>
            <option value="column">縦棒</option>
          </select>
        </label>
        <label class="ksqld-label-inline">ラベル列
          <input type="text" class="ksqld-input ksqld-pane-label-col" placeholder="担当" />
        </label>
        <label class="ksqld-label-inline">値列
          <input type="text" class="ksqld-input ksqld-pane-value-col" placeholder="件数" />
        </label>
      </div>
    </div>
  </div>
</template>
